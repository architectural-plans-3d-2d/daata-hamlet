<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daata Hamlet on the globe</title>
<script>window.CESIUM_BASE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/cesium/1.118.0/';</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.118.0/Widgets/widgets.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
:root{
  --sheet:#ffffff; --ink:#17212b; --muted:#5d6b78; --line:#d3dae1;
  --accent:#b5482b; --accent-ink:#ffffff; --paper:#eef1f4;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sheet:#182129; --ink:#e8edf1; --muted:#9aa8b5; --line:#2a3640; --accent:#e2724f; --accent-ink:#10161c; --paper:#10161c; color-scheme:dark}}
html,body{height:100%;margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink)}
#cesiumContainer{position:absolute;inset:0}
.cesium-widget-credits{font-size:10px!important}
header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--sheet) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand h1{font:700 clamp(.95rem,4.2vw,1.1rem)/1.15 var(--font-display);margin:0;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:.72rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sheet);flex:none}
.seg button{border:0;background:transparent;color:var(--ink);font:500 .8rem var(--font-body);min-height:40px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:background-color .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;width:min(300px,calc(100% - 24px));
  background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;box-shadow:0 8px 28px rgb(0 0 0 /.18)}
.panel h2{margin:0 0 2px;font:600 .8rem var(--font-body)}
.panel .help{margin:0 0 10px;font-size:.72rem;color:var(--muted);line-height:1.35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font:600 .66rem var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.fld input{min-height:40px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:9px;padding:0 10px;
  font:500 .82rem var(--font-data);width:100%}
.hd{margin-top:10px}
.hd .top{display:flex;justify-content:space-between;font:600 .66rem var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.hd .top b{font-family:var(--font-data);color:var(--ink);font-weight:500}
.hd input[type="range"]{width:100%;height:40px;accent-color:var(--accent)}
.go{margin-top:10px;width:100%;min-height:46px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:11px;
  font:600 .88rem var(--font-body);cursor:pointer}
.go:active{filter:brightness(.95)}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:var(--sheet);border:1px solid var(--line);
  border-radius:10px;padding:12px 16px;font:500 .9rem var(--font-body);color:var(--ink);box-shadow:0 8px 28px rgb(0 0 0 /.2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<header>
  <div class="brand">
    <h1>Daata Hamlet on the globe</h1>
    <p><a href="index.html" style="color:var(--accent);text-decoration:none;font-weight:600">‹ Plan viewer</a> · Ground floor REV-04</p>
  </div>
  <div class="seg" role="group" aria-label="Stair option">
    <button id="optL" aria-pressed="true">L</button>
    <button id="optU" aria-pressed="false">U</button>
  </div>
</header>

<div class="panel">
  <h2>Place the house</h2>
  <p class="help">Paste your plot's latitude &amp; longitude (Google Maps: right-click the spot → the first row copies the numbers), then drag <b>Heading</b> until the house lines up with the satellite image.</p>
  <div class="grid">
    <div class="fld"><label for="lat">Latitude</label><input id="lat" inputmode="decimal" value="31.5204"></div>
    <div class="fld"><label for="lng">Longitude</label><input id="lng" inputmode="decimal" value="74.3587"></div>
  </div>
  <div class="hd">
    <div class="top"><span>Heading</span><b id="hdVal">0°</b></div>
    <input type="range" id="heading" min="0" max="359" step="1" value="0" aria-label="Heading in degrees from north">
  </div>
  <button class="go" id="go">Place &amp; fly there</button>
</div>

<div class="status" id="status">Loading globe…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.118.0/Cesium.js"></script>
<script>
// Free, key-free satellite imagery from Esri World Imagery on the WGS84 ellipsoid.
const esri = new Cesium.UrlTemplateImageryProvider({
  url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  maximumLevel: 19,
  credit: 'Imagery © Esri, Maxar, Earthstar Geographics'
});

let viewer;
try {
  viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayer: new Cesium.ImageryLayer(esri),
    baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
    homeButton: false, sceneModePicker: false, navigationHelpButton: false,
    fullscreenButton: false, infoBox: false, selectionIndicator: false
  });
} catch (e) {
  document.getElementById('status').textContent = 'Could not start the globe: ' + e.message;
  throw e;
}
viewer.scene.skyAtmosphere.show = true;
viewer.scene.globe.enableLighting = false;

const cfg = { lat: 31.5204, lng: 74.3587, height: 0, heading: 0, version: 'L' };
let modelEntity = null;

function readInputs() {
  const la = parseFloat(document.getElementById('lat').value);
  const lo = parseFloat(document.getElementById('lng').value);
  if (Number.isFinite(la)) cfg.lat = la;
  if (Number.isFinite(lo)) cfg.lng = lo;
  cfg.heading = parseFloat(document.getElementById('heading').value) || 0;
}

function place(fly) {
  readInputs();
  const pos = Cesium.Cartesian3.fromDegrees(cfg.lng, cfg.lat, cfg.height);
  const hpr = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(cfg.heading), 0, 0);
  const orientation = Cesium.Transforms.headingPitchRollQuaternion(pos, hpr);
  if (modelEntity) viewer.entities.remove(modelEntity);
  modelEntity = viewer.entities.add({
    position: pos,
    orientation,
    model: {
      uri: `DH-GF-${cfg.version}.glb`,
      scale: 1.0,                       // GLB is already in metres
      minimumPixelSize: 48,             // stay visible when zoomed far out
      maximumScale: 4000
    }
  });
  const st = document.getElementById('status');
  modelEntity.model.readyEvent?.addEventListener?.(() => { st.hidden = true; });
  setTimeout(() => { st.hidden = true; }, 2500);
  if (fly) viewer.flyTo(modelEntity, {
    duration: 1.6,
    offset: new Cesium.HeadingPitchRange(Cesium.Math.toRadians(cfg.heading + 20), Cesium.Math.toRadians(-42), 430)
  });
}

// controls
const hEl = document.getElementById('heading'), hVal = document.getElementById('hdVal');
hEl.addEventListener('input', () => {
  hVal.textContent = hEl.value + '°';
  if (modelEntity) {   // live-rotate without re-flying
    readInputs();
    const pos = Cesium.Cartesian3.fromDegrees(cfg.lng, cfg.lat, cfg.height);
    const hpr = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(cfg.heading), 0, 0);
    modelEntity.orientation = Cesium.Transforms.headingPitchRollQuaternion(pos, hpr);
  }
});
document.getElementById('go').addEventListener('click', () => place(true));
function setVersion(v) {
  cfg.version = v;
  document.getElementById('optL').setAttribute('aria-pressed', v === 'L');
  document.getElementById('optU').setAttribute('aria-pressed', v === 'U');
  place(false);
}
document.getElementById('optL').onclick = () => setVersion('L');
document.getElementById('optU').onclick = () => setVersion('U');

place(true);
</script>
</body>
</html>
