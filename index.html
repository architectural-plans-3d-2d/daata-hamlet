<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Daata Hamlet 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; slim title bar on top; a drafting-sheet control tray at the bottom (thumb reach). */
:root {
  --paper: #eef1f4;      /* page / canvas ground */
  --sheet: #ffffff;      /* tray + cards */
  --ink: #17212b;        /* text */
  --muted: #5d6b78;      /* secondary text */
  --line: #d3dae1;       /* hairlines */
  --accent: #b5482b;     /* survey-peg red */
  --accent-ink: #ffffff;
  --sky: #dfe7ee;        /* 3D background */
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10161c; --sheet: #182129; --ink: #e8edf1; --muted: #9aa8b5; --line: #2a3640;
  --accent: #e2724f; --accent-ink: #10161c; --sky: #1b252e; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #10161c; --sheet: #182129; --ink: #e8edf1; --muted: #9aa8b5; --line: #2a3640;
  --accent: #e2724f; --accent-ink: #10161c; --sky: #1b252e; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
.app { position: relative; height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet); border-bottom: 1px solid var(--line); }
.brand { min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(.95rem, 4.2vw, 1.1rem); line-height: 1.15; letter-spacing: .01em; margin: 0; }
.brand p { margin: 3px 0 0; font-size: .72rem; color: var(--muted); font-family: var(--font-body); letter-spacing: .01em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 .8rem var(--font-body); min-height: 40px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  transition: background-color .18s ease, color .18s ease; }
.seg button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"]:hover { background: var(--accent); }
.seg button:active { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.stage { position: relative; flex: 1; min-height: 0; background: var(--sky); touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; transform: translate(-50%, -50%); max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 500 .66rem var(--font-body); color: var(--ink); background: color-mix(in srgb, var(--sheet) 88%, transparent);
  border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); padding: 2px 7px; border-radius: 999px; }
.lbl.door { font-family: var(--font-data); color: var(--accent); background: color-mix(in srgb, var(--sheet) 72%, transparent); font-size: .6rem; padding: 1px 5px; }
.status { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font: 500 .85rem var(--font-body);
  color: var(--muted); background: var(--sheet); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); }
.ctl { width: 44px; height: 44px; padding: 0; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
  background: color-mix(in srgb, var(--sheet) 90%, transparent); color: var(--ink); font: 600 .78rem var(--font-body);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 2px 10px rgb(0 0 0 / .12);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.ctl svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.ctl.on, .ctl[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pad { position: absolute; left: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; }
.zcol { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
.zcol .tl { flex-direction: column; gap: 0; font-size: .55rem; line-height: 1; } .zcol .tl svg { width: 18px; height: 18px; }
.modebar { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.modebar .ctl { width: auto; padding: 0 12px; border-radius: 999px; }
.stage.noctl .pad, .stage.noctl .zcol { display: none; }
.hint { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center;
  font: 500 .76rem var(--font-body); color: var(--ink); background: color-mix(in srgb, var(--sheet) 92%, transparent);
  border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 18px rgb(0 0 0 / .14); transition: opacity .5s ease; }
.hint.gone { opacity: 0; pointer-events: none; }
.card { position: absolute; right: 12px; top: 10px; width: min(240px, calc(100% - 24px)); background: var(--sheet); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .12); }
.card h2 { margin: 0 0 4px; padding-right: 38px; font: 700 .95rem var(--font-display); }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: .78rem; }
.card dt { color: var(--muted); } .card dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.card button { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer; border-radius: 8px; transition: background-color .18s ease, color .18s ease; }
.card button:hover { color: var(--ink); background: var(--muted); }
/* bottom dock: viewpoints + a single Options button that expands a tidy panel */
.dock { background: var(--sheet); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px;
  padding: 10px max(14px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-right, 0px)); }
.views { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px; }
.views::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; min-height: 44px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 7px 15px;
  font: 500 .8rem var(--font-body); white-space: nowrap; cursor: pointer; transition: border-color .18s ease, color .18s ease, background-color .18s ease; }
.chip:hover { border-color: var(--muted); }
.chip:active { background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--paper)); font-weight: 600; }
.dockbar { display: flex; gap: 8px; }
.dockbtn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); border-radius: 12px; font: 600 .85rem var(--font-body); text-decoration: none; cursor: pointer; transition: background-color .18s ease, border-color .18s ease, color .18s ease; }
.dockbtn:active { background: color-mix(in srgb, var(--accent) 10%, var(--paper)); }
.dockbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.dockbtn .chev { font-size: .66rem; transition: transform .2s ease; }
.dockbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.panel { display: flex; flex-direction: column; gap: 12px; padding: 2px 2px 0; }
.cut { display: flex; align-items: center; gap: 12px; }
.cut .lab { font: 600 .8rem var(--font-body); color: var(--muted); white-space: nowrap; }
.cut input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.cut output { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: .85rem; min-width: 4.2em; text-align: right; color: var(--ink); }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); border-radius: 10px; font: 500 .82rem var(--font-body); cursor: pointer; transition: background-color .18s ease, border-color .18s ease, color .18s ease; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background-color .18s ease; }
.pill:active { background: color-mix(in srgb, var(--accent) 8%, var(--paper)); }
.pill[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--paper)); }
.pill[aria-pressed="true"] .dot { background: var(--accent); }
.facts { margin: 0; font: .72rem var(--font-body); color: var(--muted); }
@media (min-width: 641px) {
  .opts-btn { display: none; }
  #panel[hidden] { display: flex !important; }
  .toggles { grid-template-columns: repeat(4, auto); justify-content: start; }
  .pill { padding: 0 16px; }
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* larger, easier-to-grab range thumb for touch */
.cut input[type="range"] { height: 44px; cursor: pointer; }
.cut input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 2px solid var(--sheet); }
.cut input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 2px solid var(--sheet); border-radius: 50%; background: var(--accent); }
/* honour reduced-motion for every UI transition/animation (3D camera & gate already handled in JS) */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.app { height: 100vh; height: 100dvh; }
.floorbar { display: flex; gap: 8px; align-items: center; }
.floorbar .seg { flex: 1; display: flex; }
.floorbar .seg button { flex: 1; }
@media (max-width: 640px) { .brand p { font-size: .66rem; } .seg button { padding: 6px 10px; } }
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Daata Hamlet Residence</h1>
      <p>Ground + second floor · GF REV-04 · SF REV-08</p>
    </div>
    <div class="seg" role="group" aria-label="Stair option">
      <button id="optL" aria-pressed="true">L stair</button>
      <button id="optU" aria-pressed="false">U stair</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="3D model of the house. Drag or use arrow keys to move; pinch or scroll to zoom; use the viewpoint buttons below; tap a room for its size."></canvas>
    <div id="labels"></div>
    <div class="modebar" role="group" aria-label="Control modes">
      <button class="ctl" id="dragMode" aria-pressed="false" title="One-finger drag moves the model instead of turning it"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Drag moves</span></button>
      <button class="ctl" id="walkBtn" aria-pressed="false" title="Stand inside at eye height and walk with the arrows"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4a1.5 1.5 0 1 0 0 .1M10 21l2-6 3 3v3M9 11l3-3 3 3 3 1M12 8l-1 7"/></svg><span>Walk</span></button>
      <button class="ctl" id="ctlHide" aria-pressed="true" title="Show or hide the on-screen buttons"><span>Buttons</span></button>
    </div>
    <div class="pad" role="group" aria-label="Move and rotate">
      <button class="ctl" data-act="rotl" aria-label="Rotate left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button>
      <button class="ctl" data-act="fwd" aria-label="Move forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="ctl" data-act="rotr" aria-label="Rotate right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button>
      <button class="ctl" data-act="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ctl" id="resetBtn" aria-label="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg></button>
      <button class="ctl" data-act="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <span></span>
      <button class="ctl" data-act="back" aria-label="Move back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <span></span>
    </div>
    <div class="zcol" role="group" aria-label="Zoom and tilt">
      <button class="ctl" data-act="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ctl" data-act="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button class="ctl tl" data-act="tiltu" aria-label="Tilt up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>tilt</button>
      <button class="ctl tl" data-act="tiltd" aria-label="Tilt down">tilt<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10l6 6 6-6"/></svg></button>
    </div>
    <div class="hint" id="hint">Drag to turn · pinch to zoom · arrows to move · tap a room</div>
    <div class="status" id="status" role="status" aria-live="polite">Loading model…</div>
    <div class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="cardTitle" tabindex="-1" hidden>
      <button id="cardClose" aria-label="Close room details"><span aria-hidden="true">&times;</span></button>
      <h2 id="cardTitle"></h2>
      <dl id="cardBody"></dl>
    </div>
  </div>

  <div class="dock">
    <div class="panel" id="panel" hidden>
      <div class="cut">
        <span class="lab">Cut&nbsp;height</span>
        <input type="range" id="cutH" min="1.0" max="12.5" step="0.25" value="11.5" aria-label="Cut height in feet above floor">
        <output id="cutOut" for="cutH">11'-6"</output>
      </div>
      <div class="toggles">
        <button class="pill" id="pLabels" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Room names</button>
        <button class="pill" id="pDoors" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Door tags</button>
        <button class="pill" id="pFurn" aria-pressed="true"><span class="dot" aria-hidden="true"></span>Furniture</button>
        <button class="pill" id="gateBtn" aria-pressed="false"><span class="dot" aria-hidden="true"></span>Car gate</button>
      </div>
      <p class="facts" id="facts"></p>
    </div>
    <div class="floorbar">
      <div class="seg" id="floorSeg" role="group" aria-label="Floor">
        <button data-f="G" aria-pressed="false">Ground</button>
        <button data-f="S" aria-pressed="false">Second</button>
        <button data-f="A" aria-pressed="true">Whole house</button>
      </div>
    </div>
    <div class="views" id="views" role="group" aria-label="Viewpoints"></div>
    <div class="dockbar">
      <button class="dockbtn opts-btn" id="optsBtn" aria-expanded="false" aria-controls="panel">Options <span class="chev" aria-hidden="true">&#9662;</span></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

    for (let i = 0; i < n; i++) { out[i * sz] = a.getX(i); if (sz > 1) out[i * sz + 1] = a.getY(i); if (sz > 2) out[i * sz + 2] = a.getZ(i); if (sz > 3) out[i * sz + 3] = a.getW(i); }

  }

}
function prepare(root) {
  floors = []; gate = null;
  const edgeList = [];
  root.updateMatrixWorld(true);
  root.traverse(o => {                       // bake node transforms (quantization scale) into float geometry
    if (!o.isMesh) return;
    o.geometry = toFloat(o.geometry.index ? o.geometry.toNonIndexed() : o.geometry);
    o.geometry.applyMatrix4(o.matrixWorld);
    o.position.set(0, 0, 0); o.quaternion.identity(); o.scale.set(1, 1, 1); o.updateMatrix();
  });
  root.traverse(o => { if (!o.isMesh && o !== root) { o.position.set(0, 0, 0); o.quaternion.identity(); o.scale.set(1, 1, 1); } });
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (!o.isMesh) return;
    const name = o.material.name;
    const t = TEX[name];
    if (t) o.geometry = addUVs(o.geometry, t.userData.metres);
    o.material = styled(o.material);
    o.castShadow = !/^(road|ground|lawn|yard|floor_|SF_floor_|RF_terrace)/.test(o.name) && name !== 'glass';
    o.userData.lvl = /^SF_/.test(o.name) ? 'S' : /^RF_/.test(o.name) ? 'R' : 'G';
    o.receiveShadow = name !== 'glass';
    if (/^(SF_)?floor_/.test(o.name)) floors.push(o);
    o.userData.furn = FURN.test(o.name);
    if (o.name === 'GATE') gate = o;
    if (!/^(road|ground|lawn|stone|TREE|car_)/.test(o.name) && !/^(glass|leaf|flower|iron)$/.test(name)) edgeList.push(o);
  });
  edgeList.forEach(o => {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 28), edgeMat);
    e.userData.furn = o.userData.furn; e.userData.lvl = o.userData.lvl; e.raycast = () => {};
    o.add(e);
  });
  if (gate) { gate.userData.x0 = gate.position.x; setGate(gateOpen, true); }
}

// ---------- sliding car gate (11'-3" panel runs into the wall pocket)
let gate = null, gateOpen = false, gateAnim = null;
const GATE_RUN = (11.25 + 0.6) * FT;
const gateBtn = document.getElementById('gateBtn');
function setGate(open, instant) {
  gateOpen = open;
  gateBtn.setAttribute('aria-pressed', open);
  if (!gate) return;
  const from = gate.position.x, to = gate.userData.x0 + (open ? GATE_RUN : 0);
  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { gate.position.x = to; gateAnim = null; redraw(true); return; }
  const start = performance.now();
  gateAnim = now => { const k = Math.min(1, (now - start) / 1600), e = k * k * (3 - 2 * k);
    gate.position.x = from + (to - from) * e; redraw(k >= 1); if (k >= 1) gateAnim = null; };
}
gateBtn.addEventListener('click', () => setGate(!gateOpen));

function load(v) {
  const st = document.getElementById('status'); st.hidden = false; st.textContent = 'Loading model…';
  const done = gltf => {
    if (model) scene.remove(model);
    model = gltf.scene;
    if (!model.userData.prepared) { prepare(model); model.userData.prepared = true; }
    else { floors = []; gate = null; model.traverse(o => { if (o.isMesh && /^(SF_)?floor_/.test(o.name)) floors.push(o); if (o.name === 'GATE') gate = o; }); setGate(gateOpen, true); }
    scene.add(model); redraw(true);
    applyToggles(); st.hidden = true; buildLabels(); renderFacts();
  };
  if (cache[v]) return done(cache[v]);
  loader.load(`DH-${v}.glb`, g => { cache[v] = g; done(g); },
    e => { if (e.total) st.textContent = `Loading model… ${Math.min(99, Math.round(e.loaded / e.total * 100))}%`; },
    () => { st.textContent = 'The 3D model could not load. Check that DH-' + v + '.glb sits next to this page.'; });
}

// --- viewpoints
const viewsEl = document.getElementById('views');
let anim = null;
function goTo(name) {
  const vw = INFO[version].views[name];
  if (walk) setWalk(false, true);
  lastView = name;
  if (vw.floor && vw.floor !== floorMode) setFloor(vw.floor);
  controls.maxPolarAngle = vw.free ? Math.PI * 0.9 : Math.PI * 0.495;
  [...viewsEl.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.v === name));
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const p1 = new THREE.Vector3(...vw.eye), t1 = new THREE.Vector3(...vw.look);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = performance.now(), dur = reduce ? 1 : 900;
  anim = now => {
    const k = Math.min(1, (now - start) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(p0, p1, e); controls.target.lerpVectors(t0, t1, e);
    if (k >= 1) anim = null;
  };
}
function buildViews() {
  viewsEl.innerHTML = '';
  Object.keys(INFO[version].views).forEach(n => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = n; b.dataset.v = n;
    b.setAttribute('aria-pressed', 'false'); b.onclick = () => goTo(n); viewsEl.appendChild(b);
  });
}

// --- labels
const labelsEl = document.getElementById('labels');
let labels = [];
function buildLabels() {
  labelsEl.innerHTML = ''; labels = [];
  INFO[version].rooms.forEach(r => {
    if (/^(SF_)?(OTS|PORCH|VOID)$/.test(r.key)) return;
    const d = document.createElement('div'); d.className = 'lbl'; d.textContent = r.name; labelsEl.appendChild(d);
    labels.push({ el: d, p: new THREE.Vector3(...r.pos).add(new THREE.Vector3(0, 0.9, 0)), kind: 'room', floor: r.floor || 'G' });
  });
  INFO[version].doors.forEach(r => {
    const d = document.createElement('div'); d.className = 'lbl door'; d.textContent = r.id + ' ' + r.w; labelsEl.appendChild(d);
    labels.push({ el: d, p: new THREE.Vector3(...r.pos), kind: 'door', floor: r.floor || 'G' });
  });
  applyToggles();
}
const v3 = new THREE.Vector3();
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  labels.forEach(l => {
    if (l.el.hidden) return;
    v3.copy(l.p).project(camera);
    const on = v3.z < 1 && Math.abs(v3.x) < 0.97 && Math.abs(v3.y) < 0.97;
    l.el.style.visibility = on ? 'visible' : 'hidden';
    if (on) l.el.style.transform = `translate(${(v3.x + 1) / 2 * w}px, ${(1 - v3.y) / 2 * h}px) translate(-50%,-50%)`;
    l.el.style.left = '0'; l.el.style.top = '0';
  });
}

// --- toggles & cut
const pLabels = document.getElementById('pLabels'), pDoors = document.getElementById('pDoors'), pFurn = document.getElementById('pFurn');
// room names clutter a small screen, so default them off on phones (tap a room to identify it)
const state = { labels: matchMedia('(min-width: 641px)').matches, doors: false, furn: true };
function syncPills() {
  pLabels.setAttribute('aria-pressed', state.labels);
  pDoors.setAttribute('aria-pressed', state.doors);
  pFurn.setAttribute('aria-pressed', state.furn);
}
const cutH = document.getElementById('cutH'), cutOut = document.getElementById('cutOut');
function fmt(ft) { const t = Math.round(ft * 12); return `${Math.floor(t / 12)}'-${t % 12}"`; }
function applyToggles() {
  labels.forEach(l => l.el.hidden = l.floor !== floorMode || (l.kind === 'room' ? !state.labels : !state.doors)); redraw(false);
  const showLvl = { G: true, S: floorMode !== 'G', R: floorMode === 'A' };
  if (model) model.traverse(o => { if (o.isMesh || o.isLineSegments) o.visible = showLvl[o.userData.lvl || 'G'] && (!o.userData.furn || state.furn); });
  const hft = parseFloat(cutH.value);
  clip.constant = (floorMode === 'S' ? INFO[version].ffl_s : INFO[version].ffl) + hft * FT;
  cutOut.value = fmt(hft);
  if (hft >= 12.5 || floorMode === 'A') clip.constant = 100;
  cutH.disabled = floorMode === 'A'; cutH.parentElement.style.opacity = floorMode === 'A' ? .45 : 1;
  redraw(true);
}
pLabels.onclick = () => { state.labels = !state.labels; syncPills(); applyToggles(); };
pDoors.onclick  = () => { state.doors  = !state.doors;  syncPills(); applyToggles(); };
pFurn.onclick   = () => { state.furn   = !state.furn;   syncPills(); applyToggles(); };
syncPills();

// Options panel expander (collapsed by default on phones; always shown >=641px via CSS)
const optsBtn = document.getElementById('optsBtn'), panel = document.getElementById('panel');
optsBtn.addEventListener('click', () => {
  const opening = panel.hasAttribute('hidden');
  if (opening) panel.removeAttribute('hidden'); else panel.setAttribute('hidden', '');
  optsBtn.setAttribute('aria-expanded', opening);
  resize();   // 3D canvas re-fits as the dock grows/shrinks
});

// one-time hint toast: fades after a few seconds or on first interaction
const hintEl = document.getElementById('hint');
let hintTimer = setTimeout(() => hintEl.classList.add('gone'), 5000);
stage.addEventListener('pointerdown', () => { hintEl.classList.add('gone'); clearTimeout(hintTimer); }, { once: true });
cutH.addEventListener('input', applyToggles);

// --- tap a room
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (floorMode === 'A') return;
  const hit = ray.intersectObjects(floors.filter(f => f.visible && f.userData.lvl === floorMode), false)[0];
  if (!hit) return;
  const key = hit.object.name.replace(/floor_/, '').replace(/\.\d+$/, '');
  const room = INFO[version].rooms.find(x => x.key === key);
  if (room) showCard(room);
});
const card = document.getElementById('card');
function showCard(r) {
  document.getElementById('cardTitle').textContent = r.name;
  document.getElementById('cardBody').innerHTML =
    `<dt>Clear size</dt><dd>${r.size}</dd><dt>Area</dt><dd>${r.area.toFixed(1)} sq ft</dd>`;
  card.hidden = false;
  cardClose.focus();   // move keyboard focus into the dialog
}
const cardClose = document.getElementById('cardClose');
function hideCard() { if (card.hidden) return; card.hidden = true; canvas.focus(); }
cardClose.onclick = hideCard;
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });

function renderFacts() {
  const i = INFO[version];
  document.getElementById('facts').textContent =
    `${i.stair} (stacked to the roof) · ${i.risers} risers @ ${i.riser}" · landing +${i.landing} · ` +
    (floorMode === 'A' ? 'whole house with roof & mumty' : `${INFO[version].floors[floorMode]} walls cut at the slider height`);
}

// --- option switch
function setVersion(v) {
  version = v;
  document.getElementById('optL').setAttribute('aria-pressed', v === 'L');
  document.getElementById('optU').setAttribute('aria-pressed', v === 'U');
  buildViews(); load(v);
}
const floorSeg = document.getElementById('floorSeg');
function setFloor(f) {
  floorMode = f;
  [...floorSeg.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
  card.hidden = true; applyToggles(); renderFacts();
  if (walk) { if (f === 'A') return setWalk(false); const dy = eyeY() - camera.position.y; camera.position.y += dy; controls.target.y += dy; redraw(true); }
}
[...floorSeg.children].forEach(b => b.onclick = () => setFloor(b.dataset.f));
document.getElementById('optL').onclick = () => setVersion('L');

document.getElementById('optU').onclick = () => setVersion('U');


// --- on-screen controls: hold a button to keep moving (time-based, so speed is the same on any phone)
const held = new Set(); let walk = false, lastView = 'Whole house', lastT = performance.now();
const _o = new THREE.Vector3(), _f = new THREE.Vector3(), _r = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0), _sph = new THREE.Spherical();
const FT_M = 0.3048, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const eyeY = () => (floorMode === 'S' ? INFO[version].ffl_s : 0.5 * FT_M) + 5.2 * FT_M;
function step(act, dt) {
  anim = null;
  const fromT = _o.subVectors(camera.position, controls.target), dist = fromT.length();
  camera.getWorldDirection(_f); _f.y = 0;
  if (_f.lengthSq() < 1e-6) _f.set(-fromT.x, 0, -fromT.z);
  _f.normalize(); _r.crossVectors(_f, UP).normalize();
  const mv = (walk ? 1.7 : Math.max(2, dist) * 0.8) * dt;
  let a = act;
  if (walk && a === 'zin') a = 'fwd'; if (walk && a === 'zout') a = 'back';
  if (a === 'fwd' || a === 'back' || a === 'left' || a === 'right') {
    const d = (a === 'fwd' || a === 'back') ? _f.multiplyScalar(a === 'fwd' ? mv : -mv) : _r.multiplyScalar(a === 'right' ? mv : -mv);
    camera.position.add(d); controls.target.add(d);
  } else if (a === 'rotl' || a === 'rotr') {
    const ang = (a === 'rotl' ? 1 : -1) * 1.3 * dt;
    if (walk) { fromT.negate().applyAxisAngle(UP, ang); controls.target.copy(camera.position).add(fromT); }
    else { fromT.applyAxisAngle(UP, ang); camera.position.copy(controls.target).add(fromT); }
  } else if (a === 'tiltu' || a === 'tiltd') {
    const k = (a === 'tiltu' ? -1 : 1) * 0.9 * dt;
    if (walk) {            // look up / down: swing the aim point around the eye
      _sph.setFromVector3(fromT.negate()); _sph.phi = clamp(_sph.phi - k, 0.35, Math.PI - 0.35);
      fromT.setFromSpherical(_sph); controls.target.copy(camera.position).add(fromT);
    } else {               // tilt the orbit: higher or lower look-down angle
      _sph.setFromVector3(fromT); _sph.phi = clamp(_sph.phi + k, 0.05, controls.maxPolarAngle);
      fromT.setFromSpherical(_sph); camera.position.copy(controls.target).add(fromT);
    }
  } else if (a === 'zin' || a === 'zout') {
    fromT.setLength(clamp(dist * Math.exp((a === 'zin' ? -1.4 : 1.4) * dt), controls.minDistance, controls.maxDistance));
    camera.position.copy(controls.target).add(fromT);
  }
  redraw(false);
}
document.querySelectorAll('.ctl[data-act]').forEach(b => {
  const a = b.dataset.act, up = () => { held.delete(a); b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    held.add(a); b.classList.add('on'); lastT = performance.now(); step(a, 1 / 30); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, up));
  b.addEventListener('click', e => { if (e.detail === 0) step(a, 0.25); });   // keyboard / screen reader
  b.addEventListener('contextmenu', e => e.preventDefault());
});
function setWalk(on, quiet) {
  walk = on; anim = null;
  const wb = document.getElementById('walkBtn'); wb.setAttribute('aria-pressed', on);
  controls.enableZoom = !on; controls.minDistance = on ? 0.05 : 1.2;
  controls.maxPolarAngle = on ? Math.PI * 0.9 : Math.PI * 0.495; controls.rotateSpeed = on ? 0.45 : 1;
  if (on) {
    if (floorMode === 'A') setFloor('G');
    camera.getWorldDirection(_f); _f.y = 0; _f.normalize();
    const t = controls.target, y = eyeY();
    camera.position.set(t.x, y, t.z); controls.target.set(t.x + _f.x * 0.6, y, t.z + _f.z * 0.6);
    hintEl.textContent = 'Walking at eye height · arrows walk · ↺ ↻ turn · tilt looks up/down';
    hintEl.classList.remove('gone'); clearTimeout(hintTimer); hintTimer = setTimeout(() => hintEl.classList.add('gone'), 4000);
    redraw(true);
  } else if (!quiet) goTo(lastView);
}
document.getElementById('walkBtn').onclick = () => setWalk(!walk);
document.getElementById('resetBtn').onclick = () => { if (walk) setWalk(false, true); goTo(lastView); };
document.getElementById('dragMode').onclick = e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on);
  controls.touches.ONE = on ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
  controls.mouseButtons.LEFT = on ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
  controls.mouseButtons.RIGHT = on ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
};
document.getElementById('ctlHide').onclick = e => {
  const show = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', show);
  stage.classList.toggle('noctl', !show);
};

// --- loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); redraw(false);
}
new ResizeObserver(resize).observe(stage);
controls.addEventListener('change', () => redraw(false));
function tick(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  held.forEach(a => step(a, dt));
  if (anim) { anim(now); dirty = true; }
  if (gateAnim) gateAnim(now);
  if (controls.update()) dirty = true;
  if (dirty) { renderer.render(scene, camera); placeLabels(); dirty = false; }
  requestAnimationFrame(tick);
}
const first = INFO.L.views['Whole house'];
camera.position.set(...first.eye); controls.target.set(...first.look);
resize(); setVersion('L'); goTo('Whole house'); requestAnimationFrame(tick);
</script>
